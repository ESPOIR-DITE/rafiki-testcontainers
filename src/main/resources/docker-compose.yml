name: rafiki-standalone

services:
  # Mock Account Servicing Entity (ASE) - User-facing interface
  cloud-nine-mock-ase:
    hostname: cloud-nine-wallet
    image: ditkay/rafiki-mock-ase:standalone
    restart: always
    networks:
      - rafiki
    ports:
      - '3030:80'
    environment:
      LOG_LEVEL: debug
      PORT: 80
      SEED_FILE_LOCATION: /workspace/seed.yml
      KEY_FILE: /workspace/private-key.pem
      OPEN_PAYMENTS_URL: https://cloud-nine-wallet-backend
      AUTH_SERVER_DOMAIN: http://localhost:3006
      GRAPHQL_URL: http://cloud-nine-wallet-backend:3001/graphql
      SIGNATURE_VERSION: 1
      SIGNATURE_SECRET: iyIgCprjb9uL8wFckR+pLEkJWMB7FJhgkvqhTQR/964=
      IDP_SECRET: 2pEcn2kkCclbOHQiGNEwhJ0rucATZhrA807HTm2rNXE=
      DISPLAY_NAME: Cloud Nine Wallet
      DISPLAY_ICON: wallet-icon.svg
      OPERATOR_TENANT_ID: 438fa74a-fa7d-4317-9ced-dde32ece1787
      FRONTEND_PORT: 3010
    volumes:
      - ./cloud-nine-wallet/seed.yml:/workspace/seed.yml
      - ./cloud-nine-wallet/private-key.pem:/workspace/private-key.pem
    depends_on:
      cloud-nine-backend:
        condition: service_healthy

  # Rafiki Backend - Core ILP connector and Open Payments server
  cloud-nine-backend:
    hostname: cloud-nine-wallet-backend
    image: ditkay/rafiki-backend:standalone
    restart: always
    ports:
      - '3000:80'
      - '3001:3001'
      - '3002:3002'
    networks:
      - rafiki
    environment:
      NODE_ENV: development
      INSTANCE_NAME: CLOUD-NINE
      LOG_LEVEL: debug
      ADMIN_PORT: 3001
      CONNECTOR_PORT: 3002
      OPEN_PAYMENTS_PORT: 80
      DATABASE_URL: postgresql://cloud_nine_wallet_backend:cloud_nine_wallet_backend@shared-database/cloud_nine_wallet_backend
      USE_TIGERBEETLE: false
      AUTH_SERVER_GRANT_URL: http://cloud-nine-wallet-auth:3006
      AUTH_SERVER_INTROSPECTION_URL: http://cloud-nine-wallet-auth:3007
      AUTH_SERVICE_API_URL: http://cloud-nine-wallet-auth:3011
      ILP_ADDRESS: test.cloud-nine-wallet
      STREAM_SECRET: BjPXtnd00G2mRQwP/8ZpwyZASOch5sUXT5o0iR5b5wU=
      ADMIN_API_SECRET: iyIgCprjb9uL8wFckR+pLEkJWMB7FJhgkvqhTQR/964=
      OPEN_PAYMENTS_URL: https://cloud-nine-wallet-backend
      WEBHOOK_URL: http://cloud-nine-wallet/webhooks
      EXCHANGE_RATES_URL: http://cloud-nine-wallet/rates
      REDIS_URL: redis://shared-redis:6379/0
      WALLET_ADDRESS_URL: https://cloud-nine-wallet-backend/.well-known/pay
      ILP_CONNECTOR_URL: http://cloud-nine-wallet-backend:3002
      ENABLE_TELEMETRY: false
      KEY_ID: 7097F83B-CB84-469E-96C6-2141C72E22C0
      OPERATOR_TENANT_ID: 438fa74a-fa7d-4317-9ced-dde32ece1787
    depends_on:
      - shared-database
      - shared-redis
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3001/healthz"]
      start_period: 60s
      start_interval: 5s
      interval: 30s
      retries: 1
      timeout: 3s

  # Rafiki Auth - GNAP authorization server
  cloud-nine-auth:
    hostname: cloud-nine-wallet-auth
    image: ditkay/rafiki-auth:standalone
    restart: always
    networks:
      - rafiki
    ports:
      - '3003:3003'
      - '3006:3006'
      - '3009:3009'
      - '3011:3011'
    environment:
      NODE_ENV: development
      AUTH_DATABASE_URL: postgresql://cloud_nine_wallet_auth:cloud_nine_wallet_auth@shared-database/cloud_nine_wallet_auth
      AUTH_SERVER_URL: http://localhost:3006
      REDIS_URL: redis://shared-redis:6379/1
      IDENTITY_SERVER_URL: http://localhost:3030/mock-idp/
      IDENTITY_SERVER_SECRET: 2pEcn2kkCclbOHQiGNEwhJ0rucATZhrA807HTm2rNXE=
      COOKIE_KEY: 42397d1f371dd4b8b7d0308a689a57c882effd4ea909d792302542af47e2cd37
      ADMIN_API_SECRET: iyIgCprjb9uL8wFckR+pLEkJWMB7FJhgkvqhTQR/964=
      OPERATOR_TENANT_ID: 438fa74a-fa7d-4317-9ced-dde32ece1787
      SERVICE_API_PORT: 3011
    depends_on:
      - shared-database
      - shared-redis

  # Rafiki Admin - Web UI for managing Rafiki
  cloud-nine-admin:
    hostname: cloud-nine-wallet-admin
    image: ditkay/rafiki-frontend:standalone
    restart: always
    networks:
      - rafiki
    ports:
      - '3010:3010'
    environment:
      PORT: 3010
      LOG_LEVEL: debug
      NODE_ENV: production
      GRAPHQL_URL: http://cloud-nine-wallet-backend:3001/graphql
      OPEN_PAYMENTS_URL: https://cloud-nine-wallet-backend/
      ENABLE_INSECURE_MESSAGE_COOKIE: true
      AUTH_ENABLED: false
      SIGNATURE_VERSION: 1
    depends_on:
      cloud-nine-backend:
        condition: service_healthy

  # PostgreSQL Database
  shared-database:
    image: postgres:15
    restart: unless-stopped
    networks:
      - rafiki
    volumes:
      - database-data:/var/lib/postgresql/data/
      - ./cloud-nine-wallet/dbinit.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres

  # Redis
  shared-redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - rafiki
    ports:
      - '6379:6379'

  # ============================================
  # Happy Life Bank Services
  # ============================================

  # Happy Life Bank Mock ASE - User-facing interface
  happy-life-mock-ase:
    hostname: happy-life-bank
    image: ditkay/rafiki-mock-ase:standalone
    restart: always
    networks:
      - rafiki
    ports:
      - '3031:80'
    environment:
      LOG_LEVEL: debug
      PORT: 80
      SEED_FILE_LOCATION: /workspace/seed.yml
      KEY_FILE: /workspace/private-key.pem
      OPEN_PAYMENTS_URL: https://happy-life-bank-backend
      AUTH_SERVER_DOMAIN: http://localhost:4006
      GRAPHQL_URL: http://happy-life-bank-backend:3001/graphql
      SIGNATURE_VERSION: 1
      SIGNATURE_SECRET: iyIgCprjb9uL8wFckR+pLEkJWMB7FJhgkvqhTQR/964=
      IDP_SECRET: 2pEcn2kkCclbOHQiGNEwhJ0rucATZhrA807HTm2rNXE=
      DISPLAY_NAME: Happy Life Bank
      DISPLAY_ICON: bank-icon.svg
      OPERATOR_TENANT_ID: cf5fd7d3-1eb1-4041-8e43-ba45747e9e5d
      FRONTEND_PORT: 4010
    volumes:
      - ./happy-life-bank/seed.yml:/workspace/seed.yml
      - ./happy-life-bank/private-key.pem:/workspace/private-key.pem
    depends_on:
      happy-life-backend:
        condition: service_healthy

  # Happy Life Bank Backend - Core ILP connector and Open Payments server
  happy-life-backend:
    hostname: happy-life-bank-backend
    image: ditkay/rafiki-backend:standalone
    restart: always
    ports:
      - '4000:80'
      - '4001:3001'
      - '4002:3002'
    networks:
      - rafiki
    environment:
      NODE_ENV: development
      INSTANCE_NAME: HAPPY-LIFE
      LOG_LEVEL: debug
      ADMIN_PORT: 3001
      CONNECTOR_PORT: 3002
      OPEN_PAYMENTS_PORT: 80
      DATABASE_URL: postgresql://happy_life_bank_backend:happy_life_bank_backend@shared-database/happy_life_bank_backend
      USE_TIGERBEETLE: false
      AUTH_SERVER_GRANT_URL: http://happy-life-bank-auth:3006
      AUTH_SERVER_INTROSPECTION_URL: http://happy-life-bank-auth:3007
      AUTH_SERVICE_API_URL: http://happy-life-bank-auth:4011
      ILP_ADDRESS: test.happy-life-bank
      ILP_CONNECTOR_URL: http://happy-life-bank-backend:3002
      STREAM_SECRET: BjPXtnd00G2mRQwP/8ZpwyZASOch5sUXT5o0iR5b5wU=
      ADMIN_API_SECRET: iyIgCprjb9uL8wFckR+pLEkJWMB7FJhgkvqhTQR/964=
      WEBHOOK_URL: http://happy-life-bank/webhooks
      EXCHANGE_RATES_URL: http://happy-life-bank/rates
      OPEN_PAYMENTS_URL: https://happy-life-bank-backend
      REDIS_URL: redis://shared-redis:6379/2
      WALLET_ADDRESS_URL: https://happy-life-bank-backend/.well-known/pay
      ENABLE_TELEMETRY: false
      KEY_ID: 53f2d913-e98a-40b9-b270-372d0547f23d
      OPERATOR_TENANT_ID: cf5fd7d3-1eb1-4041-8e43-ba45747e9e5d
    depends_on:
      - shared-database
      - shared-redis
      - cloud-nine-backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3001/healthz"]
      start_period: 60s
      start_interval: 5s
      interval: 30s
      retries: 1
      timeout: 3s

  # Happy Life Bank Auth - GNAP authorization server
  happy-life-auth:
    hostname: happy-life-bank-auth
    image: ditkay/rafiki-auth:standalone
    restart: always
    networks:
      - rafiki
    ports:
      - '4003:3003'
      - '4006:3006'
      - '4009:3009'
      - '4011:4011'
    environment:
      NODE_ENV: development
      AUTH_DATABASE_URL: postgresql://happy_life_bank_auth:happy_life_bank_auth@shared-database/happy_life_bank_auth
      AUTH_SERVER_URL: http://localhost:4006
      REDIS_URL: redis://shared-redis:6379/3
      IDENTITY_SERVER_URL: http://localhost:3031/mock-idp/
      IDENTITY_SERVER_SECRET: 2pEcn2kkCclbOHQiGNEwhJ0rucATZhrA807HTm2rNXE=
      COOKIE_KEY: 42397d1f371dd4b8b7d0308a689a57c882effd4ea909d792302542af47e2cd37
      ADMIN_API_SECRET: iyIgCprjb9uL8wFckR+pLEkJWMB7FJhgkvqhTQR/964=
      OPERATOR_TENANT_ID: cf5fd7d3-1eb1-4041-8e43-ba45747e9e5d
      SERVICE_API_PORT: 4011
    depends_on:
      - shared-database
      - shared-redis
      - cloud-nine-auth

  # Happy Life Bank Admin - Web UI for managing Rafiki
  happy-life-admin:
    hostname: happy-life-bank-admin
    image: ditkay/rafiki-frontend:standalone
    restart: always
    networks:
      - rafiki
    ports:
      - '4010:4010'
    environment:
      PORT: 4010
      LOG_LEVEL: debug
      NODE_ENV: production
      GRAPHQL_URL: http://happy-life-bank-backend:3001/graphql
      OPEN_PAYMENTS_URL: https://happy-life-bank-backend/
      ENABLE_INSECURE_MESSAGE_COOKIE: true
      AUTH_ENABLED: false
      SIGNATURE_VERSION: 1
    depends_on:
      happy-life-backend:
        condition: service_healthy

networks:
  rafiki:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24
          gateway: 10.5.0.1

volumes:
  database-data:
